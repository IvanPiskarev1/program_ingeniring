{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">{% if page_obj.has_previous %}<a class="button secondary" href="?{{ query }}&page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}<span>{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button secondary" href="?{{ query }}&page={{ page_obj.next_page_number }}">Далее</a>{% endif %}</nav>{% endif %}
